name: Deploy Invitation to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'Invitation/**'
      - '.github/workflows/deploy-invitation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Invitation/package-lock.json'
      
      - name: Install dependencies
        working-directory: Invitation
        run: npm install
      
      - name: Build project
        working-directory: Invitation
        run: npm run build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Invitation/dist
          destination_dir: Invitation
          keep_files: true
