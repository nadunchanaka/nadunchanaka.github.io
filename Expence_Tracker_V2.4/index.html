<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta content="mobile_tab" name="shell-type"/>
  <meta name="description" content="Expense Tracker V2.4 - Modern personal finance management synchronized with Google Sheets (React-only, Pure CSS)"/>
  <title>Expense Tracker</title>

  <!-- Preconnect for Google Fonts -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com"/>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>

  <!-- Google Font: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet"/>

  <!-- Static Hosting (GitHub Pages) Redirect to compiled distribution -->
  <script>
    if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1' && !window.location.pathname.endsWith('/dist/') && !window.location.pathname.endsWith('/dist/index.html')) {
      var currentPath = window.location.pathname;
      if (!currentPath.endsWith('/')) currentPath += '/';
      window.location.replace(currentPath + 'dist/' + (window.location.hash || ''));
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
