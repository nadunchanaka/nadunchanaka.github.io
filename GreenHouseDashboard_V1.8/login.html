<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login | Greenhouse OS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#0c0e11",
                        "surface-container": "#171a1d",
                        "surface-container-high": "#1d2024",
                        "primary": "#81ecff",
                        "on-surface": "#f9f9fd",
                        "on-surface-variant": "#aaabaf",
                        "outline": "#747579",
                        "error": "#ff716c"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"]
                    }
                }
            }
        }
    </script>

    <style>
        .glass-card {
            background: rgba(23, 26, 29, 0.6);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(129, 236, 255, 0.1);
        }

        .glow-effect {
            box-shadow: 0 0 40px -10px rgba(129, 236, 255, 0.3);
        }

        input:focus {
            box-shadow: 0 0 15px -2px rgba(129, 236, 255, 0.4) !important;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .floating-bg {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(129, 236, 255, 0.15) 0%, rgba(129, 236, 255, 0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: -1;
            animation: float 10s infinite ease-in-out;
        }
    </style>
</head>

<body class="bg-surface text-on-surface font-body overflow-hidden min-h-screen flex items-center justify-center relative">
    
    <!-- Animated background elements -->
    <div class="floating-bg" style="top: -100px; left: -100px; animation-delay: 0s;"></div>
    <div class="floating-bg" style="bottom: -100px; right: -100px; animation-delay: -5s;"></div>
    <div class="floating-bg" style="top: 40%; left: 60%; animation-delay: -2s; width: 200px; height: 200px; background: radial-gradient(circle, rgba(131, 251, 165, 0.1) 0%, rgba(131, 251, 165, 0) 70%);"></div>

    <div class="w-full max-w-md p-6">
        <div class="glass-card rounded-3xl p-8 glow-effect">
            <div class="flex flex-col items-center mb-10">
                <div class="w-16 h-16 bg-primary/20 rounded-2xl flex items-center justify-center mb-6 border border-primary/30">
                    <span class="material-symbols-outlined text-primary text-4xl">eco</span>
                </div>
                <h1 class="text-3xl font-black font-headline tracking-tighter text-on-surface mb-2">Greenhouse OS</h1>
                <p class="text-on-surface-variant text-sm font-medium tracking-wide uppercase">Sector Control Authentication</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1" for="username">Access Identity</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">person</span>
                        <input autocomplete="off" class="w-full bg-surface-container border-none rounded-2xl py-4 pl-12 pr-4 text-on-surface placeholder-on-surface-variant/40 focus:ring-1 focus:ring-primary/50 transition-all font-medium" id="username" placeholder="Enter username" type="text" />
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1" for="password">Encryption Key</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">lock_open</span>
                        <input class="w-full bg-surface-container border-none rounded-2xl py-4 pl-12 pr-4 text-on-surface placeholder-on-surface-variant/40 focus:ring-1 focus:ring-primary/50 transition-all font-medium" id="password" placeholder="••••••••" type="password" />
                    </div>
                </div>

                <div id="errorMessage" class="hidden flex items-center gap-2 text-error text-xs font-bold bg-error/10 p-4 rounded-xl border border-error/20">
                    <span class="material-symbols-outlined text-sm">error</span>
                    <span>Authentication failed. Invalid credentials.</span>
                </div>

                <button class="w-full py-4 bg-primary text-surface font-black font-headline rounded-2xl hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group overflow-hidden relative" type="submit">
                    <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                    <span class="relative z-10">INITIALIZE SYSTEM</span>
                    <span class="material-symbols-outlined relative z-10 group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </button>
            </form>

            <div class="mt-8 flex justify-center">
                <p class="text-on-surface-variant text-[10px] font-label uppercase tracking-widest bg-surface-container/50 px-4 py-1.5 rounded-full border border-white/5">
                    Security Level: Alpha-7 • Monitoring Active
                </p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            if (user === 'admin' && pass === 'admin') {
                // Successful login
                errorMsg.classList.add('hidden');
                
                // Optional: Store login state
                localStorage.setItem('gh_auth', 'true');
                
                // Visual feedback before redirect
                const btn = e.target.querySelector('button');
                btn.innerHTML = '<span class="animate-spin material-symbols-outlined">sync</span> SIGNING IN...';
                btn.classList.add('opacity-80', 'cursor-wait');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            } else {
                // Failed login
                errorMsg.classList.remove('hidden');
                
                // Shake effect on form
                const card = document.querySelector('.glass-card');
                card.classList.add('animate-shake');
                setTimeout(() => card.classList.remove('animate-shake'), 500);
                
                // Highlight error
                document.getElementById('password').value = '';
                document.querySelectorAll('input').forEach(i => {
                    i.classList.add('ring-1', 'ring-error/50');
                    setTimeout(() => i.classList.remove('ring-1', 'ring-error/50'), 2000);
                });
            }
        });

        // Simple CSS animations for extra polish
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-8px); }
                75% { transform: translateX(8px); }
            }
            .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
        `;
        document.head.appendChild(style);
    </script>
</body>

</html>
